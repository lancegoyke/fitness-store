[project]
name = "fitness-store"
version = "0"
description = "A fitness store application"
authors = [{ name = "Lance Goyke", email = "lance@lancegoyke.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "Django>=5.2",
  "Pillow",
  "boto3",
  "dj-database-url",
  "django-allauth[socialaccount]",
  "django-cors-headers",
  "django-lifecycle",
  "django-clearcache",
  "django-embed-video",
  "django-markdownx",
  "django-ses[events]>=4.7.2",
  "django-storages[s3]",
  "gunicorn",
  "hiredis",
  "Markdown",
  "psycopg[binary]>=3.2.9",
  "python-dotenv",
  "redis",
  "sentry-sdk",
  "stripe",
  "whitenoise[brotli]",
  "django-filter>=25.1",
  "google-genai>=1.26.0",
  "anthropic>=0.112.0",
  "pywebpush>=2.3.0",
  "django-q2>=1.10.0",
  "openpyxl>=3.1",
  "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
  "coverage",
  "django-browser-reload",
  "django-debug-toolbar",
  "django-upgrade",
  "factory_boy",
  "ipython",
  "ipdb",
  "pylint-django",
  "pytest",
  "pytest-sugar",
  "pytest-django",
  "ruff",
  "playwright>=1.61.0",
  "pytest-playwright>=0.9.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
  "app/store_project/admin_honeypot/tests/test_suite.py",
  "app/store_project/**/migrations/*.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = [
  "E203",
  "E501",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
# `-m "not e2e"` is belt-and-suspenders: `testpaths` already keeps a bare
# `uv run pytest` from ever collecting `e2e/` at all. `just e2e` overrides it
# with its own `-m e2e` (the later `-m` on the command line wins over this
# one from addopts — argparse's "store" action, not an AND).
addopts = "--ds=config.settings.test --ignore=app/store_project/admin_honeypot/tests -m \"not e2e\""
python_files = ["tests.py", "test_*.py"]
pythonpath = ["app"]
# Only `app/` is collected by default — `e2e/` (issue #506) is local,
# opt-in, browser-driven, and slow; it's reached only via `just e2e`, which
# passes `e2e` as an explicit collection path.
testpaths = ["app"]
markers = [
  "e2e: local headless-browser journeys (opt-in via just e2e)",
]

[tool.curlylint.rules]
image_alt = true
